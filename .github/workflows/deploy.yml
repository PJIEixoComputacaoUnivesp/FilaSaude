name: Deploy

# Production is updated only on demand, from the Actions tab ("Run workflow")
# or with `gh workflow run deploy.yml --ref main`. Leave image_tag empty to
# deploy the latest main, or pass an older sha-<commit> to roll back to it.
#
# Images are built and published to GHCR only here (CI does not build them),
# so the registry holds only versions that were deployed. If the image of the
# chosen commit is missing (never deployed, or deleted), it is built from that
# commit and pushed.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Imagem a publicar (sha-<commit>). Vazio = último commit da main."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_NAMESPACE: pjieixocomputacaounivesp

jobs:
  prepare:
    name: Validar commit
    # Only from main, only when enabled, and only for the people listed in the
    # comma-separated DEPLOYERS variable (the actor who started or re-ran it).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      contains(format(',{0},', vars.DEPLOYERS), format(',{0},', github.triggering_actor))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}

    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          tag=${INPUT_TAG:-sha-$GITHUB_SHA}
          if ! printf '%s' "$tag" | grep -Eq '^sha-[0-9a-f]{40}$'; then
            echo "::error::image_tag deve ter o formato sha-<commit de 40 caracteres>, recebido: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=${tag#sha-}" >> "$GITHUB_OUTPUT"
          echo "Publicando $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout main history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only commits that reached main and passed CI can go to production.
      - name: Check that the commit is on main and passed CI
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::O commit $COMMIT não está na main."
            exit 1
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?check_name=Qualidade%20do%20monorepo" \
            --jq '[.check_runs[].conclusion] | if any(. == "success") then "success" else (first // "missing") end')
          if [ "$conclusion" != "success" ]; then
            echo "::error::A CI do commit $COMMIT não passou (Qualidade do monorepo: $conclusion). Aguarde a CI terminar na main."
            exit 1
          fi

  images:
    name: Publicar imagem ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: API
            image: filasaude-api
            dockerfile: apps/api/Dockerfile
          - name: Web
            image: filasaude-web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image already exists
        id: existing
        env:
          IMAGE: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE já existe; build ignorado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the commit
        if: steps.existing.outputs.found != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Configure Docker Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy em produção
    needs: [prepare, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Resolve image tag
        id: tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # Deployment files come from the same commit as the image, so a rollback
      # also restores the matching compose file, Caddyfile and scripts.
      - name: Checkout deployment files of that commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.commit }}

      - name: Prepare SSH and environment files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          {
            printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'IMAGE_TAG=%s\n' "$TAG"
          } > "$RUNNER_TEMP/production.env"

      - name: Copy deployment files
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          scp -i "$RUNNER_TEMP/deploy_key" \
            deploy/Caddyfile \
            deploy/compose.prod.yaml \
            deploy/deploy.sh \
            deploy/backup.sh \
            "$RUNNER_TEMP/production.env" \
            "deploy@$DROPLET_HOST:/opt/filasaude/"
          ssh -i "$RUNNER_TEMP/deploy_key" "deploy@$DROPLET_HOST" \
            'mv /opt/filasaude/production.env /opt/filasaude/.env && chmod 600 /opt/filasaude/.env && chmod 700 /opt/filasaude/deploy.sh /opt/filasaude/backup.sh'

      - name: Authenticate server to GHCR
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i "$RUNNER_TEMP/deploy_key" "deploy@$DROPLET_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy images
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ssh -i "$RUNNER_TEMP/deploy_key" "deploy@$DROPLET_HOST" \
            "/opt/filasaude/deploy.sh deploy '$TAG'"

      - name: Check public health endpoint
        id: health
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          case "$APP_DOMAIN" in
            http://* | https://*) app_url=$APP_DOMAIN ;;
            *) app_url="https://$APP_DOMAIN" ;;
          esac
          curl --fail --show-error --silent \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "$app_url/api/health"

      - name: Confirm release
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ssh -i "$RUNNER_TEMP/deploy_key" "deploy@$DROPLET_HOST" \
            "/opt/filasaude/deploy.sh confirm '$TAG'"

      - name: Roll back after failed public check
        if: failure() && steps.health.outcome == 'failure'
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          ssh -i "$RUNNER_TEMP/deploy_key" "deploy@$DROPLET_HOST" \
            "/opt/filasaude/deploy.sh rollback"
