name: filasaude-production

services:
  caddy:
    image: docker.io/library/caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    image: ${API_IMAGE:-ghcr.io/pjieixocomputacaounivesp/filasaude-api}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-filasaude}
      DB_USER: ${POSTGRES_USER:-filasaude}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Optional. Without a valid list the admin endpoints do not exist (404).
      ADMIN_API_TOKENS: ${ADMIN_API_TOKENS:-}
      WEBHOOK_SOURCE_CONFIG: ${WEBHOOK_SOURCE_CONFIG:?WEBHOOK_SOURCE_CONFIG is required}
      # Optional. "true" publishes the simulated occupancy to the site; the
      # deploy also starts the simulator (see deploy.sh).
      OCCUPANCY_SIMULATION_ENABLED: ${OCCUPANCY_SIMULATION_ENABLED:-false}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/pjieixocomputacaounivesp/filasaude-web}:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Synthetic occupancy source for the academic demonstration. It only runs
  # with the "simulation" profile, which deploy.sh turns on together with
  # OCCUPANCY_SIMULATION_ENABLED. It talks to the API inside the network and
  # reads each signing secret from WEBHOOK_SOURCE_CONFIG.
  simulator:
    profiles: ["simulation"]
    image: ${SIMULATOR_IMAGE:-ghcr.io/pjieixocomputacaounivesp/filasaude-simulador}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SIMULATOR_API_URL: http://api:3000
      SIMULATOR_SOURCE_IDS: ${SIMULATOR_SOURCE_IDS:-occupancy-feed}
      SIMULATOR_SCENARIO: national
      SIMULATOR_DURATION_SECONDS: "0"
      SIMULATOR_ALLOW_LOAD_TEST: "true"
      SIMULATOR_ALLOW_NONLOCAL_TARGET: "true"
      SIMULATOR_INTERVAL_SECONDS: "120"
      # Sends occupancy.snapshot.v2 with waiting, in service and completed.
      SIMULATOR_ATTENDANCE: ${SIMULATOR_ATTENDANCE:-true}
      SIMULATOR_ATTENDANCE_SCENARIO: ${SIMULATOR_ATTENDANCE_SCENARIO:-normal}
      WEBHOOK_SOURCE_CONFIG: ${WEBHOOK_SOURCE_CONFIG:?WEBHOOK_SOURCE_CONFIG is required}
    mem_limit: 96m
    cpus: 0.25
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filasaude}
      POSTGRES_USER: ${POSTGRES_USER:-filasaude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Small, fixed footprint: the dataset has a few MB and the Droplet has 1 GB of RAM.
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=10
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
